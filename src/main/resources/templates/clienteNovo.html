<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>NutriFit - Novo Cliente</title>
</head>
<body>
<main>
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Novo Cliente</h2>
        <p class="text-gray-500 text-sm mt-1">Preencha os dados para cadastrar um novo cliente</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 max-w-lg">
        <form th:action="@{/cliente/salvar}" method="post">
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                <input type="text" name="nome" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400"
                       placeholder="Nome completo">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Login</label>
                <input type="text" name="login" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400"
                       placeholder="Login">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" name="senha" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400"
                       placeholder="Senha">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Idade</label>
                <input type="number" name="idade" required min="1" max="120"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400"
                       placeholder="Idade">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Altura (cm)</label>
                <input type="number" step="0.01" name="altura" required min="0.5" max="3"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400"
                       placeholder="Altura em cm">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Peso (kg)</label>
                <input type="number" step="0.01" name="peso" required min="1" max="500"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400"
                       placeholder="Peso em kg">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Gênero</label>
                <select name="genero"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400">
                    <option value="MASCULINO">Masculino</option>
                    <option value="FEMENINO">Feminino</option>
                </select>
            </div>
            <div class="flex gap-3">
                <button type="submit"
                        class="flex-1 bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2 rounded-lg transition-colors text-sm">
                    Salvar
                </button>
                <a th:href="@{/cliente/listar}"
                   class="flex-1 text-center border border-gray-300 hover:bg-gray-50 text-gray-600 font-semibold py-2 rounded-lg transition-colors text-sm">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
