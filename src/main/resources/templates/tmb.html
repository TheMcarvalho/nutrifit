<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>NutriFit - Calcular TMB</title>
</head>
<body>
<main>
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Taxa Metabólica Basal</h2>
        <p class="text-gray-500 text-sm mt-1">Calcule quantas calorias seu corpo gasta em repouso</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Formulário de cálculo -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <h3 class="text-base font-semibold text-gray-700 mb-4">Calcular TMB</h3>
            <form th:action="@{/tmb/salvar}" method="post">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nível de Atividade</label>
                    <select name="nivelAtividade"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400">
                        <option value="SEDENTARIO">Sedentário</option>
                        <option value="LEVEMENTE_ATIVO">Levemente Ativo</option>
                        <option value="MODERADAMENTE_ATIVO">Moderadamente Ativo</option>
                        <option value="MUITO_ATIVO">Muito Ativo</option>
                        <option value="EXTREMAMENTE_ATIVO">Extremamente Ativo</option>
                    </select>
                </div>
                <button type="submit"
                        class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2 rounded-lg transition-colors text-sm">
                    Calcular
                </button>
            </form>
        </div>

        <!-- Histórico de TMB -->
        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <h3 class="text-base font-semibold text-gray-700 mb-4">Histórico de Cálculos</h3>
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b border-gray-100">
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Data</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">TMB (kcal)</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Necessidade Calórica</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Nível de Atividade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tmb : ${listarPorCliente}"
                        class="border-b border-gray-50 hover:bg-gray-50">
                        <td class="py-2 px-3 text-gray-600" th:text="${tmb.data}">Data</td>
                        <td class="py-2 px-3 text-gray-800 font-semibold" th:text="${#numbers.formatDecimal(tmb.resultadoTMB, 1, 2)}">0</td>
                        <td class="py-2 px-3 text-gray-600" th:text="${#numbers.formatDecimal(tmb.necessidadeCalorica, 1, 2)}">0</td>
                        <td class="py-2 px-3 text-gray-600" th:text="${tmb.nivelAtividade}">Nível</td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${listarPorCliente == null or listarPorCliente.isEmpty()}"
               class="text-gray-400 text-sm mt-4">Nenhum cálculo realizado ainda</p>
        </div>

    </div>
</main>
</body>
</html>
