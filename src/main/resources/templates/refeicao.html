<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>NutriFit - Refeições</title>
</head>
<body>
<main>
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Refeições</h2>
            <p class="text-gray-500 text-sm mt-1">Acompanhe suas refeições diárias</p>
        </div>
        <a th:href="@{/refeicao/novo}"
           class="bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">
            Nova Refeição
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-gray-100">
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Tipo</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Descrição</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Calorias</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="refeicao : ${listarRefeicoes}"
                    class="border-b border-gray-50 hover:bg-gray-50">
                    <td class="py-2 px-3 text-gray-800" th:text="${refeicao.tipoRefeicao}">Tipo</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${refeicao.descricao}">Descrição</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${refeicao.caloria}">0</td>
                    <td class="py-2 px-3">
                        <form th:action="@{/refeicao/deletar}" method="post">
                            <input type="hidden" name="id" th:value="${refeicao.id}">
                            <button type="submit"
                                    class="text-red-500 hover:text-red-700 text-xs font-medium">
                                Deletar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${listarRefeicoes == null or listarRefeicoes.isEmpty()}"
           class="text-gray-400 text-sm mt-4">Nenhuma refeição cadastrada</p>
    </div>
</main>
</body>
</html>
