<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>NutriFit - Clientes</title>
</head>
<body>
<main>
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Clientes</h2>
            <p class="text-gray-500 text-sm mt-1">Clientes cadastrados no sistema</p>
        </div>
        <a th:href="@{/cliente/novo}"
           class="bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">
            Novo Cliente
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-gray-100">
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Nome</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Login</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Idade</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Gênero</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${listarClientes}"
                    class="border-b border-gray-50 hover:bg-gray-50">
                    <td class="py-2 px-3 text-gray-800" th:text="${cliente.nome}">Nome</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${cliente.login}">Login</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${cliente.idade}">0</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${cliente.genero}">Gênero</td>
                    <td class="py-2 px-3">
                        <form th:action="@{/cliente/deletar}" method="post">
                            <input type="hidden" name="id" th:value="${cliente.id}">
                            <button type="submit"
                                    class="text-red-500 hover:text-red-700 text-xs font-medium">
                                Deletar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${listarClientes == null or listarClientes.isEmpty()}"
           class="text-gray-400 text-sm mt-4">Nenhum cliente cadastrado</p>
    </div>
</main>
</body>
</html>
