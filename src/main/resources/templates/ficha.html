<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>NutriFit - Fichas de Treino</title>
</head>
<body>
<main>
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Fichas de Treino</h2>
            <p class="text-gray-500 text-sm mt-1">Fichas cadastradas no sistema</p>
        </div>
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/fichaTreino/novo}"
           class="bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">
            Nova Ficha
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-gray-100">
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Nome</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Cliente</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Data Início</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ficha : ${listarFichas}"
                    class="border-b border-gray-50 hover:bg-gray-50">
                    <td class="py-2 px-3 text-gray-800" th:text="${ficha.nome}">Nome</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${ficha.cliente != null ? ficha.cliente.nome : '-'}">Cliente</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${ficha.dataInicio}">Data</td>
                    <td class="py-2 px-3 flex gap-3">
                        <a th:href="@{/fichaTreino/ver(id=${ficha.id})}"
                           class="text-primary-600 hover:text-primary-800 text-xs font-medium">
                            Ver
                        </a>
                        <form sec:authorize="hasRole('ADMIN')" th:action="@{/fichaTreino/deletar}" method="post">
                            <input type="hidden" name="id" th:value="${ficha.id}">
                            <button type="submit"
                                    class="text-red-500 hover:text-red-700 text-xs font-medium">
                                Deletar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${listarFichas == null or listarFichas.isEmpty()}"
           class="text-gray-400 text-sm mt-4">Nenhuma ficha cadastrada</p>
    </div>
</main>
</body>
</html>
