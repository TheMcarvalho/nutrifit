<!DOCTYPE html>
<html th:fragment="layout(title, content)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">NutriFit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50:  '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex">

    <aside class="w-60 bg-primary-700 min-h-screen flex flex-col fixed left-0 top-0 shadow-lg">

        <div class="p-6 border-b border-primary-600">
            <h1 class="text-white text-xl font-bold tracking-wide">NutriFit</h1>
            <p class="text-primary-300 text-xs mt-1">Sistema de Saúde e Treino</p>
        </div>

        <nav class="flex-1 p-4">
            <ul class="space-y-1">
                <li>
                    <a th:href="@{/dashboard}"
                       class="block px-4 py-2 rounded-lg text-primary-100 hover:bg-primary-600 hover:text-white transition-colors text-sm">
                        Dashboard
                    </a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/exercicio/listar}"
                       class="block px-4 py-2 rounded-lg text-primary-100 hover:bg-primary-600 hover:text-white transition-colors text-sm">
                        Exercícios
                    </a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/cliente/listar}"
                       class="block px-4 py-2 rounded-lg text-primary-100 hover:bg-primary-600 hover:text-white transition-colors text-sm">
                        Clientes
                    </a>
                </li>
                <li>
                    <a th:href="@{/fichaTreino/listar}"
                       class="block px-4 py-2 rounded-lg text-primary-100 hover:bg-primary-600 hover:text-white transition-colors text-sm">
                        Fichas de Treino
                    </a>
                </li>
                <li>
                    <a th:href="@{/meta/listar}"
                       class="block px-4 py-2 rounded-lg text-primary-100 hover:bg-primary-600 hover:text-white transition-colors text-sm">
                        Metas
                    </a>
                </li>
                <li>
                    <a th:href="@{/refeicao/listar}"
                       class="block px-4 py-2 rounded-lg text-primary-100 hover:bg-primary-600 hover:text-white transition-colors text-sm">
                        Refeições
                    </a>
                </li>
                <li>
                    <a th:href="@{/tmb/listar}"
                       class="block px-4 py-2 rounded-lg text-primary-100 hover:bg-primary-600 hover:text-white transition-colors text-sm">
                        Calcular TMB
                    </a>
                </li>
            </ul>
        </nav>


        <div class="p-4 border-t border-primary-600">
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                        class="w-full text-left px-4 py-2 rounded-lg text-primary-100 hover:bg-primary-600 hover:text-white transition-colors text-sm">
                    Sair
                </button>
            </form>
        </div>
    </aside>


    <div class="ml-60 flex-1 p-8">
        <main th:replace="${content}">
        </main>
    </div>

</body>
</html>
