<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>NutriFit - Detalhes da Ficha</title>
</head>
<body>
<main>
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold text-gray-800" th:text="${ficha.nome}">Ficha de Treino</h2>
            <p class="text-gray-500 text-sm mt-1">
                Data de início: <span th:text="${ficha.dataInicio}">Data</span>
            </p>
        </div>
        <a th:href="@{/fichaTreino/listar}"
           class="border border-gray-300 hover:bg-gray-50 text-gray-600 text-sm font-semibold px-4 py-2 rounded-lg transition-colors">
            Voltar
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <h3 class="text-base font-semibold text-gray-700 mb-4">Itens da Ficha</h3>
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-gray-100">
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Exercício</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Séries</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Repetições</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Carga (kg)</th>
                    <th class="text-left py-2 px-3 text-gray-500 font-medium">Feito</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${ficha.itensFicha}"
                    class="border-b border-gray-50 hover:bg-gray-50">
                    <td class="py-2 px-3 text-gray-800" th:text="${item.exercicio.nome}">Exercício</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${item.series}">0</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${item.repeticoes}">0</td>
                    <td class="py-2 px-3 text-gray-600" th:text="${item.carga}">0</td>
                    <td class="py-2 px-3">
                        <span th:if="${item.feito}"
                              class="px-2 py-0.5 rounded-full bg-primary-100 text-primary-700 text-xs">Feito</span>
                        <span th:unless="${item.feito}"
                              class="px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 text-xs">Pendente</span>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${ficha.itensFicha == null or ficha.itensFicha.isEmpty()}"
           class="text-gray-400 text-sm mt-4">Nenhum item nesta ficha</p>
    </div>
</main>
</body>
</html>
