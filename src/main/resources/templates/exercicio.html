<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>NutriFit - Exercícios</title>
</head>
<body>
<main>
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Exercícios</h2>
        <p class="text-gray-500 text-sm mt-1">Gerencie os exercícios disponíveis</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <h3 class="text-base font-semibold text-gray-700 mb-4">Novo Exercício</h3>
            <form th:action="@{/exercicio/salvar}" method="post">
                <input type="hidden" name="id" th:value="${exercicio != null ? exercicio.id : 0}">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                    <input type="text" name="nome" required
                           th:value="${exercicio != null ? exercicio.nome : ''}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400"
                           placeholder="Nome do exercício">
                </div>
                <button type="submit"
                        class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2 rounded-lg transition-colors text-sm">
                    Salvar
                </button>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <h3 class="text-base font-semibold text-gray-700 mb-4">Lista de Exercícios</h3>
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b border-gray-100">
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">ID</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Nome</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="exercicio : ${listarExercicios}"
                        class="border-b border-gray-50 hover:bg-gray-50">
                        <td class="py-2 px-3 text-gray-600" th:text="${exercicio.id}">1</td>
                        <td class="py-2 px-3 text-gray-800" th:text="${exercicio.nome}">Exercício</td>
                        <td class="py-2 px-3 flex gap-3">
                            <a th:href="@{/exercicio/editar/{id}(id=${exercicio.id})}"
                               class="text-blue-500 hover:text-blue-700 text-xs font-medium">
                                Editar
                            </a>
                            <form th:action="@{/exercicio/deletar}" method="post">
                                <input type="hidden" name="id" th:value="${exercicio.id}">
                                <button type="submit"
                                        class="text-red-500 hover:text-red-700 text-xs font-medium">
                                    Deletar
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${listarExercicios == null or listarExercicios.isEmpty()}"
               class="text-gray-400 text-sm mt-4">Nenhum exercício cadastrado</p>
        </div>

    </div>
</main>
</body>
</html>
